name: me_mobile
description: "Me Admin : application Android d'administration du portfolio armeldev.xyz (contenu, blog, messages, devis et factures, statistiques)."
homepage: https://armeldev.xyz
publish_to: 'none'

# X.Y.Z+N : voir la règle de versionnage dans CLAUDE.md.
version: 1.7.0+8

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.3
  device_info_plus: ^13.2.0
  google_fonts: ^6.2.1
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  just_audio: ^0.9.42
  image_picker: ^1.1.2
  # 8.x compile en dur compileSdk 34 côté Android (bogue connu du plugin),
  # incompatible avec flutter_plugin_android_lifecycle qui exige 36+.
  file_picker: ^13.1.0
  flutter_svg: ^2.3.0
  video_player: ^2.14.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  crypto: ^3.0.7
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
